[project]
name = "traffic-emissions"
version = "1.0.1"
description = "This indicator computes carbon dioxide emissions from road traffic in an area of interest within Germany"
authors = [
    { name = "Veit Ulrich", email = "veit.ulrich@heigit.org"},
    { name = "Sebastian Block", email = "sebastian.block@heigit.org"},
    { name = "Emily Wilke", email = "emily.wilke@heigit.org"},
]
readme = "README.md"


requires-python = ">=3.13.5,<3.14"
dependencies = [
    "climatoology @ git+https://gitlab.heigit.org/climate-action/climatoology.git@7.1.4",
    "ohsome-py2 @ git+https://gitlab.heigit.org/climate-action/utilities/ohsome-py2.git@0.2.1",
    "pydantic (>=2.8.2,<3.0.0)",
    "pydantic-settings (>=2.1.0,<3.0.0)",
    "pydantic-extra-types (>=2.10.5,<3.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    "rasterstats (>=0.20.0,<0.21.0)",
    "scikit-learn (>=1.8.0,<1.9.0)",
    "rasterio[s3] (>=1.5.0,<2.0.0)",
    "tqdm (>=4.67.3,<5.0.0)",
    "geopandas (>=1.1.3,<2.0.0)",
    "numpy (>=2.4.4,<3.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "pandas (>=2.1.3, <3.0.0)",
    "pyproj (>=3.7.2,<4.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "affine (>=2.4.0,<3.0.0)",
]

[project.urls]
repository = "https://gitlab.heigit.org/climate-action/plugins/traffic-emissions"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
responses = "^0.26.0"
approvaltests = "^15.2.1"
pytest-recording = "^0.13.4"
python-dotenv = "^1.2.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"
pandas-stubs = "^2.3.2.250827"
ruff = "^0.15.20"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select = [
    # defaults
    "F",
    "E4", "E7", "E9",
    # additional
    "A", # be sure not to shadow built-in functions
    "I", # isort to sort imports
    "N", # check for use of PEP8 naming conventions
    # docstring cleaning
    "D201", "D207", "D208", "D209", "D210", "D214", "D215", "D300", "D403",
    # auto-remove unused 'noqa' comments
    "RUF100", "RUF101",
]

[tool.coverage.run]
omit = ["test/*", "traffic_emissions/core/*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
